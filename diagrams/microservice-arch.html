<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>微服务架构全景 · 微服务 05</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: "Microsoft YaHei", sans-serif; }
  body { background: #0f172a; color: #e2e8f0; padding: 26px; }
  h1 { color: #7dd3fc; font-size: 21px; }
  .sub { color: #94a3b8; font-size: 13px; margin-bottom: 14px; }
  .btns { margin-bottom: 14px; }
  button { background: #1e40af; color: #dbeafe; border: none; border-radius: 8px; padding: 8px 16px;
           font-size: 13px; cursor: pointer; margin-right: 8px; }
  button:hover { background: #3b82f6; }
  button.reset { background: #334155; color: #cbd5e1; }
  svg { display: block; margin: auto; }
  rect.box { fill: #1e293b; stroke: #475569; stroke-width: 1.6; rx: 8; }
  rect.box.hl { stroke: #22d3ee; stroke-width: 2.5; filter: drop-shadow(0 0 8px #22d3ee88); }
  rect.box.hot { stroke: #f87171; stroke-width: 2.5; filter: drop-shadow(0 0 8px #f8717188); }
  rect.box.gw { fill: #164e63; }
  rect.box.svc { fill: #1e3a5f; }
  rect.box.infra { fill: #1c2a1e; }
  text.label { fill: #e2e8f0; font-size: 14px; font-weight: bold; text-anchor: middle; }
  text.desc { fill: #7c8ba1; font-size: 11px; text-anchor: middle; }
  line, path { stroke: #64748b; stroke-width: 1.6; }
  .flow { stroke: #22d3ee; stroke-width: 2.5; fill: none; marker-end: url(#arr); }
  .fhot { stroke: #f87171; }
  text.flowlbl { fill: #22d3ee; font-size: 11.5px; }
  .detail { width: 940px; margin: 14px auto; min-height: 90px; background: #020617; border: 1px solid #1e293b;
            border-radius: 10px; padding: 12px; font-size: 13px; color: #94a3b8; line-height: 1.8; }
  .detail b { color: #7dd3fc; }
  .detail .r { color: #f87171; }
</style>
</head>
<body>
<h1>微服务架构全景交互图</h1>
<div class="sub">微服务 05 · 点击组件查看说明，或点顶部按钮演示"一次请求的旅程"</div>

<div class="btns">
  <button onclick="journey()">▶ 演示一次请求的旅程</button>
  <button class="reset" onclick="reset()">↺ 重置</button>
</div>

<svg width="940" height="470">
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
    <path d="M0,0 L8,4 L0,7" fill="#22d3ee"/></marker></defs>

  <!-- 用户 -->
  <rect class="box" id="user" x="30" y="60" width="110" height="52"/>
  <text class="label" x="85" y="88">用户</text>
  <text class="desc" x="85" y="104">浏览器/App</text>

  <!-- 网关 -->
  <rect class="box gw" id="gateway" x="230" y="60" width="130" height="52"/>
  <text class="label" x="295" y="88">Gateway 网关</text>
  <text class="desc" x="295" y="104">路由·鉴权·限流</text>

  <!-- 服务A：community -->
  <rect class="box svc" id="svcA" x="460" y="20" width="200" height="60"/>
  <text class="label" x="560" y="45">community-service</text>
  <text class="desc" x="560" y="63">帖子·签到·UV（8082）</text>
  <rect class="box svc" id="svcB" x="460" y="120" width="200" height="60"/>
  <text class="label" x="560" y="145">user-service</text>
  <text class="desc" x="560" y="163">用户·积分（8083）</text>
  <rect class="box svc" id="svcC" x="460" y="220" width="200" height="60"/>
  <text class="label" x="560" y="245">order-service</text>
  <text class="desc" x="560" y="263">订单·秒杀</text>

  <!-- Nacos -->
  <rect class="box infra" id="nacos" x="30" y="330" width="160" height="60"/>
  <text class="label" x="110" y="355">Nacos</text>
  <text class="desc" x="110" y="373">注册+配置中心</text>
  <!-- Sentinel -->
  <rect class="box infra" id="sentinel" x="230" y="330" width="160" height="60"/>
  <text class="label" x="310" y="355">Sentinel</text>
  <text class="desc" x="310" y="373">限流·熔断·降级</text>
  <!-- MQ -->
  <rect class="box infra" id="mq" x="430" y="330" width="160" height="60"/>
  <text class="label" x="510" y="355">RabbitMQ</text>
  <text class="desc" x="510" y="373">审核管道·Feed广播</text>
  <!-- Redis -->
  <rect class="box infra" id="redis" x="630" y="330" width="160" height="60"/>
  <text class="label" x="710" y="355">Redis</text>
  <text class="desc" x="710" y="373">计数·榜单·Feed·签到</text>
  <!-- MySQL -->
  <rect class="box infra" id="mysql" x="830" y="330" width="90" height="60"/>
  <text class="label" x="875" y="355">MySQL</text>
  <text class="desc" x="875" y="373">真源</text>
</svg>

<div class="detail" id="detail">
  <b>点击上方任意组件查看说明</b>，或点"演示一次请求的旅程"看高亮路径动画。
</div>

<script>
"use strict";
const INFO = {
  user:    { name:"用户", body:"浏览器/App 发起 HTTP 请求。经 DNS→LB 到达网关。" },
  gateway: { name:"Gateway 网关", body:"统一入口四件事：<b>路由</b>（谓词匹配转发到服务名）、<b>鉴权</b>（验 token，用户身份转发 X-User-Id）、<b>限流</b>（令牌桶/Redis，秒杀漏斗②层）、<span class='r'>观测</span>（生成 traceId 一路传递——stage6/04）。只做横切不做业务。" },
  svcA:    { name:"community-service", body:"论坛业务：帖子 CRUD、签到(Bitmap)、热榜(ZSet)、UV(HLL)、Feed 收件箱(List)。计数走 Redis 削峰，CounterFlushJob 异步刷 MySQL 底账。" },
  svcB:    { name:"user-service", body:"用户/积分：登录态、积分流水(message_id 幂等)。与 community 通过 Feign 同步调用（需要即时结果时）或 MQ 异步。" },
  svcC:    { name:"order-service", body:"订单/秒杀：Redis Lua 预扣 + MQ 匀速落库 + DB WHERE stock>0 兜底（mq-mall 架构）。" },
  nacos:   { name:"Nacos", body:"注册中心：服务启动注册，调用方按服务名发现。临时实例心跳 5s 走 AP(Distro)；持久实例走 CP(Raft)。也是配置中心（长轮询 29.5s 动态刷新——动态线程池的基础）。" },
  sentinel:{ name:"Sentinel", body:"限流（固定/滑动窗口+令牌桶）、熔断（关闭→打开→半开三态）、降级（返回兜底数据）。防止下游故障沿调用链雪崩。规则可从控制台动态推送，持久化到 Nacos。" },
  mq:      { name:"RabbitMQ", body:"异步管道：本地消息表(事务原子)+Confirm+补偿重发+死信落库（reliability.html 演示的四场景）。审核管道/fanout 广播/Feed 扩散。" },
  redis:   { name:"Redis", body:"高频热数据全部可丢可重建：登录态 String、计数 INCR、点赞去重 Set、热榜/积分榜 ZSet、签到 Bitmap、UV HLL、Feed 收件箱 List。" },
  mysql:   { name:"MySQL", body:"唯一真源：帖子/用户/积分流水。Redis 计数削峰后由定时任务刷进来（Write Behind DECR 增量法）。" }
};
const JOURNEY = [
  { seq:[["user","gateway"]], text:"① 用户请求进入网关：验 token、限流检查、生成 traceId" },
  { seq:[["gateway","svcA"]], text:"② 路由到 community-service（Nacos 提供实例地址，负载均衡）" },
  { seq:[["svcA","redis"]], text:"③ community 读热数据：Feed 收件箱/热榜/计数（Redis 三连）" },
  { seq:[["svcA","nacos"]], text:"④ 需要用户积分详情 → 按服务名发现 user-service（Nacos 服务发现）" },
  { seq:[["svcA","svcB"]], text:"⑤ OpenFeign 同步调用 user-service（LoadBalancer 选实例）" },
  { seq:[["svcB","mysql"]], text:"⑥ user-service 查 MySQL 真源 → 返回 → 沿调用链原路返回" },
  { seq:[["svcA","mq"]], text:"⑦ 帖子发布事件 → MQ 异步广播（审核管道/Fanout，别阻塞主链路）" }
];
let hlTimer = null;
function reset(){ clearHl(); document.getElementById("detail").innerHTML = "<b>点击上方任意组件查看说明</b>"; }
function clearHl(){ document.querySelectorAll("rect.box").forEach(r=>r.classList.remove("hl","hot")); }
function show(id){
  clearHl(); document.getElementById(id).classList.add("hl");
  const i = INFO[id];
  document.getElementById("detail").innerHTML = `<b>${i.name}</b> — ${i.body}`;
}
function journey(){
  clearHl(); let step = 0;
  if(hlTimer) clearInterval(hlTimer);
  hlTimer = setInterval(()=>{
    if(step >= JOURNEY.length){ clearInterval(hlTimer); clearHl(); return; }
    clearHl();
    const j = JOURNEY[step];
    j.seq.forEach(([a,b])=>{
      document.getElementById(a).classList.add("hl");
      document.getElementById(b).classList.add("hl");
    });
    document.getElementById("detail").innerHTML = `<b>请求旅程 ${step+1}/${JOURNEY.length}</b> — ${j.text}`;
    step++;
  }, 1300);
}
document.querySelectorAll("rect.box").forEach(r=>{
  r.style.cursor = "pointer";
  r.addEventListener("click", () => show(r.id));
});
reset();
</script>
</body>
</html>
