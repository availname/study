const CARDS = [
  { m:"并发", q:"synchronized 原理与锁升级？", a:"Mark Word 存锁状态 + Monitor(Owner/EntryList/WaitSet)。升级链：偏向锁(单线程免CAS，JDK15废弃)→轻量级(CAS自旋，交替竞争)→重量级(OS互斥量，激烈竞争)。可重入靠计数器。附带可见性保证(进出同步块刷主存)。" },
  { m:"并发", q:"volatile 作用？能替代锁吗？", a:"可见性(lock前缀刷主存+使其它核缓存失效)+有序性(内存屏障禁重排，DCL必加)。不保证原子性(count++仍交错)。不能替代锁——复合操作用锁或CAS。判断用 happens-before 规则链。" },
  { m:"并发", q:"线程池七参数与执行流程？", a:"core/max/keepAlive/unit/workQueue/threadFactory/handler。流程：核心未满建核心→满则入队→队满建临时到max→触发拒绝。先排队后扩容→无界队列让max失效(Executors坑OOM)。生产手写+有界队列+自定义拒绝+动态调参。" },
  { m:"并发", q:"CAS 是什么？ABA 怎么解决？", a:"CPU原子指令(比较+交换一步)。①ABA(值回旧值但历史已变→AtomicStampedReference版本号)②自旋耗CPU(LongAdder分段)③单变量限制。分布式同思想：乐观锁版本号。" },
  { m:"并发", q:"ThreadLocal 内存泄漏？", a:"Thread→ThreadLocalMap：key弱引用(可回收变null)、value强引用——线程池线程不死则value泄漏。规约：finally remove()。另：不能跨线程传递。" },
  { m:"并发", q:"ConcurrentHashMap JDK8 原理？", a:"空桶CAS写入；非空桶synchronized锁头节点(粒度=桶)；链表≥8且表≥64转红黑树；多线程协同扩容；CounterCell分段计数(LongAdder思想)。key/value不允许null。" },
  { m:"并发", q:"死锁四条件与排查？", a:"互斥/持有等待/不可剥夺/循环等待。排查：jstack找deadlock、Arthas thread -b。预防：固定加锁顺序、tryLock超时、缩小锁粒度。" },
  { m:"JVM", q:"内存区域划分？", a:"共享：堆(Eden+2Survivor/老年代)、元空间(类信息，本地内存)。私有：虚拟机栈(栈帧)、本地方法栈、程序计数器。异常：堆OOM heap space、元空间OOM、栈StackOverflowError。" },
  { m:"JVM", q:"对象什么时候被回收？", a:"可达性分析：GC Roots(栈变量/静态/常量/JNI/活跃线程)不可达即垃圾。不用引用计数(循环引用)。四引用：软(缓存内存不足回收)、弱(ThreadLocal key)、虚(堆外管理)。" },
  { m:"JVM", q:"G1 vs CMS？为什么 G1 成默认？", a:"CMS标记清除→碎片+并发失败退化Full GC。G1：Region化堆(2048块逻辑分代)+按回收收益挑Region+MaxGCPauseMillis停顿目标模型+无碎片。ZGC再进：着色指针亚毫秒停顿与堆大小无关。" },
  { m:"JVM", q:"CPU 100% 怎么排查？", a:"top定进程→top -Hp定线程→TID转16进制→jstack对应堆栈。常见：死循环/频繁GC/正则回溯/大对象序列化。Arthas thread -n 3 一步到位。" },
  { m:"JVM", q:"内存泄漏怎么排查？", a:"判定：Full GC后水位不回落且抬升。jmap dump(OOM自动dump先配)→MAT支配树→凶手：无界缓存/ThreadLocal/监听器/连接。修复：上限/TTL/remove。" },
  { m:"MySQL", q:"为什么用 B+ 树？", a:"磁盘IO是瓶颈：B+非叶子只存键(16KB页放更多键，千万行3~4层)；叶子链表支持范围查询。对比：哈希无范围、二叉太高、B树非叶子带数据树更高。" },
  { m:"MySQL", q:"回表/覆盖索引/最左前缀？", a:"二级索引叶子只存(索引列+主键)→查非索引列需拿主键回聚簇树再查=回表。查询列全在索引=覆盖(Using index)。联合索引按第一列排→最左前缀，范围列之后失效。" },
  { m:"MySQL", q:"四大隔离级别？MVCC 原理？", a:"RU/RC/RR(默认)/串行化。MVCC=隐藏列(trx_id/roll_pointer)+undo版本链+ReadView(活跃名单)。判定：==自己✓/<min✓/≥max✗/在名单✗。RC每次新ReadView，RR复用首次。" },
  { m:"MySQL", q:"索引失效场景？", a:"函数包裹列、隐式类型转换(varchar=数字)、左模糊like、OR侧无索引、≠/not in(优化器理性放弃)。EXPLAIN：type=ALL全表/key=NULL/rows大。" },
  { m:"MySQL", q:"redo/undo/binlog 区别？两阶段提交为什么？", a:"redo(InnoDB物理循环写，crash-safe)/undo(逻辑反操作，回滚+MVCC)/binlog(Server逻辑追加，复制+CDC)。两阶段提交(redo prepare→binlog→commit)保证两者一致→主从一致。双1配置。" },
  { m:"MySQL", q:"大表深分页优化？", a:"LIMIT 100万,10 扫100万行丢弃。方案A键集游标：WHERE id>上页末尾 LIMIT 10(最优，游标翻页)；方案B延迟关联：子查询覆盖索引取id再回表(兼容跳页)。" },
  { m:"MySQL", q:"死锁排查预防？", a:"SHOW ENGINE INNODB STATUS 看 LATEST DEADLOCK；8.0 查 data_lock_waits。预防：短事务、按固定顺序加锁、更新条件走索引、防重用唯一索引替代先查后插(间隙锁共存互堵)。" },
  { m:"Redis", q:"Redis 为什么快？", a:"内存+命令执行单线程(无锁无切换)+epoll多路复用+高效数据结构(SDS/跳表/listpack)。6.0 IO多线程但命令仍单线程。代价：慢命令阻塞全端(禁KEYS防大Key)。" },
  { m:"Redis", q:"穿透/击穿/雪崩？", a:"穿透(查不存在)→空值缓存+布隆过滤器+参数校验；击穿(热点过期瞬间)→互斥锁重建/逻辑过期；雪崩(大面积同时失效)→TTL抖动+多级缓存+高可用+DB熔断。监控命中率。" },
  { m:"Redis", q:"缓存与DB一致性？", a:"Cache Aside：读-未命中回写(带TTL)；写-先更DB再删缓存(幂等无覆盖)。残留窗口极小；高要求延迟双删(MQ延迟)；复杂系统binlog(Canal)→MQ→删缓存零侵入。强一致放弃缓存。" },
  { m:"Redis", q:"分布式锁实现？", a:"SET key requestId NX EX 原子抢锁；释放Lua校验requestId(防误删他人锁)；看门狗续期(Redisson)。主从切换可能双持锁→正确性场景DB兜底(乐观锁/唯一索引)，Redis锁是效率层。" },
  { m:"Redis", q:"Redisson 看门狗何时生效？", a:"只有不传 leaseTime 才启用：lock()或两参tryLock(waitTime,unit)→默认30s每10s续回；三参tryLock(3,30,SECONDS)传了leaseTime反而关闭看门狗。释放必须isHeldByCurrentThread防IllegalMonitorState/误删他人锁。" },
  { m:"Redis", q:"大Key/热Key？", a:"大Key(String>10KB/集合>5000)：阻塞全端、UNLINK异步删、分桶/上限。热Key(单key QPS极高)：本地缓存+读写分离+热写打散。发现：--bigkeys/top-key上报。" },
  { m:"Redis", q:"持久化 RDB vs AOF？", a:"RDB全量快照(文件小恢复快，分钟级丢)，fork+COW；AOF命令日志(everysec丢1秒，重写压缩)。生产双开+混合持久化(AOF重写base用RDB格式)——恢复快+丢数据少。" },
  { m:"Redis", q:"主从/哨兵/集群？", a:"主从异步复制(切换丢尾部)；哨兵(主观下线→客观下线→选主，3个奇数)；Cluster 16384槽(CRC16%16384)，多key同槽哈希标签。容量够用选哨兵、超大选Cluster或云托管。" },
  { m:"MQ", q:"为什么用 MQ？三大作用？", a:"异步提速(490ms→52ms)/解耦(新下游零改动)/削峰填谷(洪峰进队列匀速消费)。不该用：强一致同步、需要即时结果、QPS极低。" },
  { m:"MQ", q:"消息丢失怎么防？", a:"三端：生产端Confirm+本地消息表(业务+消息同事务，afterCommit发送，定时补偿)；Broker持久化+副本；消费端手动ACK+重试+死信。Confirm丢失窗口由补偿兜底，重复由幂等拦截。" },
  { m:"MQ", q:"消息重复怎么幂等？", a:"at-least-once必重复，业务幂等两层：Redis setnx快去重(24h TTL，失败回滚键)+DB唯一索引兜底；天然幂等优先(状态机CAS)。幂等键=全局唯一业务ID(内存计数器重启撞号坑)；跳过打日志。" },
  { m:"MQ", q:"消息顺序怎么保证？", a:"业务分区有序即可。RocketMQ：MessageQueueSelector按key选队列+Orderly消费；Kafka分区内有序(key路由+重试乱序注意)；RabbitMQ单队列单消费者。业务侧版本号丢弃兜底。" },
  { m:"MQ", q:"消息堆积怎么办？", a:"诊断(消费者挂/慢/生产暴涨)→修复瓶颈→扩容三步(扩队列+搬运+扩消费者)→过期消息丢弃补偿。预防：批量消费+限速保护下游+堆积/延迟告警。" },
  { m:"MQ", q:"延迟消息怎么做？", a:"RabbitMQ：TTL+DLX(队头阻塞→档位拆队列)或延迟插件；RocketMQ 18等级/5.x任意时间。订单超时：延迟消息+扫表双保险，CAS防与支付竞态。" },
  { m:"MQ", q:"事务消息/最终一致？", a:"本地消息表(业务+消息同事务，afterCommit发送，定时补偿)→RocketMQ半消息(内置)。选型：同步短链路强一致Seata AT；异步长链路MQ最终一致；资金TCC。消费端幂等永远要有。" },
  { m:"Spring", q:"Bean 生命周期？", a:"实例化→属性注入→Aware→BPP前→初始化(@PostConstruct→afterPropertiesSet→init-method)→BPP后(AOP代理生成处)→使用→销毁(@PreDestroy→destroy-method)。" },
  { m:"Spring", q:"循环依赖三级缓存？", a:"一级成品/二级早期引用/三级工厂(延迟决定AOP代理)。字段注入可解、构造器注入无解(@Lazy)。三级而非两级：延迟判断'是否提前代理'，不破坏代理后置生成。" },
  { m:"Spring", q:"AOP 失效场景？", a:"万变不离'没走代理'：自调用this、非public、final/static、new出来的对象、注解标接口(CGLib)。修复：拆bean/注入自己@Lazy/getBean。" },
  { m:"Spring", q:"@Transactional 失效八连？", a:"①自调用②非public③异常被catch吞④默认不回滚受检异常(rollbackFor=Exception)⑤事务内多线程(ThreadLocal连接隔离)⑥传播误用⑦MyISAM⑧类不受管理。事务=ThreadLocal绑定连接，afterCommit再发MQ。" },
  { m:"微服务", q:"Nacos 注册中心原理？", a:"临时实例心跳5s(AP/Distro)+持久实例服务端探测(CP/Raft)；保护阈值防全摘除。配置中心长轮询29.5s准实时刷新(@RefreshScope)。对比：Eureka纯AP停更、ZK纯CP。" },
  { m:"微服务", q:"Feign 注意什么？", a:"声明式HTTP(代理+服务发现+负载均衡)。超时显式配、写接口禁自动重试(重试放大写，下游幂等兜底)、RequestInterceptor传登录态/traceId、Sentinel fallback降级。" },
  { m:"微服务", q:"Sentinel 限流熔断？", a:"限流算法(固定/滑动/令牌桶漏桶)；熔断三态(关闭→打开→半开探测)；降级返回兜底(本地缓存/默认值)。规则控制台动态+Nacos持久化。防下游故障沿链路雪崩。" },
  { m:"微服务", q:"Seata AT 原理？", a:"两阶段+undo_log：一阶段记录前后镜像+业务SQL直接本地提交；全局回滚按前镜像反向补偿(校验后镜像防脏写=CAS)。对比本地消息表：准实时强一致但全局锁开销；异步长链路MQ最终一致。" },
  { m:"语言", q:"HashMap 的 put 流程和扩容？", a:"hash高低16位异或→(n-1)&hash定位桶→空桶直放/链表尾插→≥8且表≥64转红黑树。负载0.75→扩容2倍：新位置只有原位或原位+旧容量两种(无需重算hash)。JDK7头插死循环、8尾插修，但仍线程不安全→CHM。" },

/* ==================== 工具 ==================== */
const LS = {
  read(k){ try { return new Set(JSON.parse(localStorage.getItem(k)||"[]")); } catch(e){ return new Set(); } },
  write(k, set){ localStorage.setItem(k, JSON.stringify([...set])); },
  done(){ return this.read("jc_done"); },
  known(){ return this.read("jc_known"); },
  checks(){ return this.read("jc_checks"); },
  saveDone(s){ this.write("jc_done", s); },
  saveKnown(s){ this.write("jc_known", s); },
  saveChecks(s){ this.write("jc_checks", s); },
  getDoneCount(){ return this.done().size; }
};
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function pill(text, color){ return `<span class="pill ${color||'blue'}">${text}</span>`; }

let openMods = {};
function renderCourses(){
  const filter = ($("q") ? $("q").value : "").toLowerCase();
  let html = `<h1>📚 课程（共 ${COURSES.reduce((s,c)=>s+c.mods.reduce((n,m)=>n+m.lessons.length,0),0)} 篇）</h1>
  <div class="pageSub">勾选标记完成状态；点击标题打开对应文档（IDE 或浏览器）</div>
  <input type="text" id="q" placeholder="🔍 搜索课程标题…" value="${esc(filter)}">`;
  COURSES.forEach(c => {
    let doneN = 0, total = 0;
    c.mods.forEach(m => total += m.lessons.length);
    c.mods.forEach(m => m.lessons.forEach(l => { if(LS.done().has(c.id+"/"+l[0])) doneN++; }));
    html += `<div class="mod open"><div class="mod-head">
      ${pill(c.icon+" "+c.name, c.color)}
      <span style="color:#94a3b8;font-size:12px">${doneN}/${total} 已完成</span></div><div class="mod-body">`;
    c.mods.forEach(m => {
      html += `<div style="color:#64748b;font-size:12px;margin:10px 0 4px">${m.name}</div>`;
      m.lessons.forEach(l => {
        const key = c.id+"/"+l[0];
        const done = LS.done().has(key);
        html += `<div class="lesson">
          <input type="checkbox" class="cb" ${done?"checked":""} onchange="toggleDone('${key}')">
          <a href="${m.base}${(m.single||m.base.endsWith('.md'))?'':l[0]+'.md'}">${l[1]}</a>
          ${done?pill("✓ 完成","green"):pill("未完成","blue")}
        </div>`;
      });
    });
    html += `</div></div>`;
  });
  $("main").innerHTML = html;
  $("q").addEventListener("input", renderCourses);
}
function toggleDone(key){
  const s = LS.done();
  if(s.has(key)) s.delete(key); else s.add(key);
  LS.saveDone(s); renderCourses();
}

/* ==================== 视图：示意图 ==================== */
function renderDiagrams(){
  const cards = DIAGRAMS.map(d => `
    <div class="card dcard" onclick="window.open('${d.f}','_blank')">
      <div class="ic">${d.ic}</div><h3>${d.t}</h3><p>${d.d}</p>
      ${pill(d.tag, d.tag==="MQ"?"blue":d.tag==="Redis"?"orange":d.tag==="并发"?"purple":d.tag==="MySQL"?"green":d.tag==="网络"?"blue":"purple")}
      <p style="margin-top:8px;color:#0284c7">↗ 新窗口打开交互演示</p>
    </div>`).join("");
  $("main").innerHTML = `<h1>🎨 交互示意图画廊（${DIAGRAMS.length} 个）</h1>
  <div class="pageSub">🐣 生活比喻版 = 没基础也能看懂 · 🔧 技术版 = 带参数调节的深色工程风。均为单文件零依赖。</div>
  <div class="grid g3">${cards}</div>`;
}

/* ==================== 视图：面试卡片 ==================== */
let cardFilter = "全部", cardPos = 0;
function renderCards(){
  const mods = [...new Set(CARDS.map(c=>c.m))];
  $("main").innerHTML = `
  <h1>🃏 面试卡片（翻转记忆）</h1>
  <div class="pageSub">点击卡片翻面看要点；"已掌握"进统计。已掌握 ${LS.known().size}/${CARDS.length}</div>
  <div class="cardtools">
    <span>分类：</span>
    ${["全部",...mods].map(m=>`<span class="lnk ${cardFilter===m?"on":""}" onclick="cardFilter='${m}';cardPos=0;renderCards()">${m}</span>`).join(" · ")}
  </div>
  <div class="fcard" id="fcard" style="cursor:pointer" onclick="flipCard()"></div>
  <div class="flipbtns">
    <button class="b-flip" onclick="flipCard()">🔄 翻面看要点</button>
    <button class="b-know" onclick="mark(true)">✓ 已掌握</button>
    <button class="b-again" onclick="mark(false)">✗ 再看看</button>
    <button class="b-nav" onclick="nextCard(1)">下一张 ▶</button>
  </div>`;
  flipCard(); flipped = false;
}
function filteredCards(){ return CARDS.filter(c => cardFilter==="全部" || c.m===cardFilter); }
let flipped = false;
function flipCard(){
  flipped = !flipped;
  const c = filteredCards()[cardPos % filteredCards().length];
  $("fcard").classList.toggle("back", flipped);
  if (c) {
    $("fcard").innerHTML = `
      <div class="mod-tag">${pill(c.m,"blue")} ${LS.known().has(c.q)?pill("✓ 已掌握","green"):""}</div>
      <div class="q">${flipped ? "答题要点" : c.q}</div>
      <div class="a" style="display:${flipped?"block":"none"}">${flipped ? esc(c.a) : "点卡片翻面看答题要点"}</div>
      <div class="hint">${flipped ? "再点翻回问题" : "点卡片翻面看答题要点 · 已掌握标记见下方按钮"}</div>`;
  }
}
function mark(known){
  const list = filteredCards();
  const c = list[cardPos % list.length];
  if(!c) return;
  const ks = LS.known(); if(known) ks.add(c.q); else ks.delete(c.q); LS.saveKnown(ks);
  flipCard(); flipped = false;
}
function nextCard(d){ cardPos += d; flipped = false; flipCard(); }

/* ==================== 视图：踩坑 ==================== */
function renderPits(){
  $("main").innerHTML = `<h1>🕳️ 踩坑实录（12 个真实坑）</h1>
  <div class="pageSub">完整版（现象→排查→根因→修复→教训）：<a class="lnk" href="../mq/踩坑实录-完整复盘.md">mq/踩坑实录-完整复盘.md</a></div>` +
  PITS.map(p=>`<div class="pit"><div class="no">${p.no}</div><div><div class="t">${p.t}</div><div class="d">${p.d}</div></div></div>`).join("");
}

/* ==================== 视图：清单 ==================== */
const GROUPS = [["环境与入门",0,3],["mq 教程",3,5],["redis 教程",5,8],["java-core 基础",8,11],["java-core 进阶（系统设计/安全/事故/运维）",11,18],["项目与面试",18,20]];
function renderCheck(){
  let html = `<h1>✅ 任务清单（总检查）</h1><div class="pageSub">勾选自动保存。全部完成 = 整套教学毕业</div>`;
  GROUPS.forEach(([name,s,e])=>{
    html += `<h2 class="sec">${name}</h2>`;
    for(let i=s;i<e;i++){
      const done = LS.checks().has(String(i));
      html += `<div class="chk ${done?"done":""}"><input type="checkbox" ${done?"checked":""} onchange="toggleCheck(${i})"><span>${CHECKS[i]}</span></div>`;
    }
  });
  const doneN = CHECKS.filter((c,i)=>LS.checks().has(String(i))).length;
  html += `<div class="statline">已完成 ${doneN}/${CHECKS.length}</div>`;
  $("main").innerHTML = html;
}
function toggleCheck(i){
  const s = LS.checks();
  if(s.has(String(i))) s.delete(String(i)); else s.add(String(i));
  LS.saveChecks(s); renderCheck();
}

/* ==================== 路由 ==================== */
function go(v){ document.querySelector(`.nav-item[data-v="${v}"]`).click(); }
const VIEWS = { dash:renderDash, courses:renderCourses, diagrams:renderDiagrams,
                cards:renderCards, pits:renderPits, check:renderCheck };
function render(){ VIEWS[view](); }
document.querySelectorAll(".nav-item").forEach(el => {
  el.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach(x => x.classList.remove("on"));
    el.classList.add("on");
    view = el.dataset.v;
    render();
  });
});
render();
</script>
</body>
</html>
