<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>函数、参数与 return</title>
</head>
<body>
  <h1>函数、参数与 return</h1>
  <input id="score" type="number" value="86" />
  <button id="run-button" type="button">计算等级</button>
  <p id="output"></p>

  <script>
    function getLevel(score) {
      if (score >= 90) {
        return '优秀'
      }

      if (score >= 60) {
        return '及格'
      }

      return '不及格'
    }

    document.querySelector('#run-button').addEventListener('click', () => {
      const score = Number(document.querySelector('#score').value)
      document.querySelector('#output').textContent = getLevel(score)
    })
  </script>
</body>
</html>
