<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>表单提交与 FormData</title>
</head>
<body>
  <h1>表单提交与 FormData</h1>
  <form id="student-form">
    <label for="student-name">姓名：</label>
    <input id="student-name" name="name" type="text" required />

    <label for="student-score">成绩：</label>
    <input id="student-score" name="score" type="number" required />

    <button type="submit">提交</button>
  </form>
  <button id="show-data-button" type="button">显示所有表单数据</button>
  <p id="output"></p>

  <script>
    const form = document.querySelector('#student-form')

    form.addEventListener('submit', (event) => {
      event.preventDefault()

      const formData = new FormData(form)
      const name = formData.get('name')
      const score = formData.get('score')

      document.querySelector('#output').textContent = name + '：' + score + ' 分'
    })

    document.querySelector('#show-data-button').addEventListener('click', () => {
      const formData = new FormData(form)
      const lines = []

      for (const [key, value] of formData.entries()) {
        lines.push(key + '：' + value)
      }

      document.querySelector('#output').textContent = lines.join('；')
    })
  </script>
</body>
</html>
