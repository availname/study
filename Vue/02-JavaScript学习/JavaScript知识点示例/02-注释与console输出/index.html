<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>注释与 console 输出</title>
</head>
<body>
  <h1>注释与 console 输出</h1>
  <p>按 F12 打开浏览器控制台查看输出。</p>

  <script>
    // 单行注释：这一行不会执行
    console.log('普通信息')
    console.warn('警告信息')
    console.error('错误信息演示')
  </script>
</body>
</html>
