<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>JavaScript 与 script</title>
</head>
<body>
  <h1>JavaScript 与 script</h1>
  <p id="message">JavaScript 还没有执行。</p>

  <script>
    document.querySelector('#message').textContent = 'script 中的 JavaScript 已经执行。'
  </script>
</body>
</html>
